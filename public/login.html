
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePoint | Staff Login</title>

    <style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#f4f8ff 0%,#f8fafc 55%,#edf4ff 100%);font-family:"Segoe UI",Arial,sans-serif;color:#1d2939}
.login-container{width:min(420px,100%);background:#fff;padding:38px;border:1px solid #e6edf6;border-radius:18px;box-shadow:0 18px 55px rgba(30,64,110,.09)}
.login-mark{width:54px;height:54px;margin:0 auto 18px;border-radius:16px;background:#1769d2;color:#fff;display:grid;place-items:center;font-size:32px;font-weight:500}
h1{margin:0 0 8px;color:#172b4d;text-align:center;font-size:25px;letter-spacing:-.7px}
.subtitle{text-align:center;color:#7b8798;margin:0 0 28px;font-size:13px;line-height:1.6}
label{display:block;margin:17px 0 8px;font-size:12px;font-weight:650;color:#344054}
input{width:100%;height:46px;padding:0 13px;border:1px solid #dce4ee;border-radius:9px;font:inherit;font-size:13px;color:#1d2939;background:#fff}
input:focus{outline:none;border-color:#6ba6ef;box-shadow:0 0 0 3px rgba(23,105,210,.1)}
button{width:100%;margin-top:23px;min-height:46px;padding:12px;background:#1769d2;color:#fff;border:0;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;transition:background .2s}
button:hover{background:#1055b3}
button:disabled{opacity:.6;cursor:not-allowed}
#msg{min-height:20px;margin-top:14px;color:#b42332;font-size:12px;text-align:center}
.footer{text-align:center;color:#98a2b3;font-size:11px;margin-top:24px}
</style>
</head>

<body>

    <main class="login-container">

        <h1>CarePoint</h1>
        <p class="subtitle">Hospital Management System</p>

        <form id="loginForm">

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                Login
            </button>

            <p id="msg" role="alert"></p>

        </form>

        <div class="footer">
            CarePoint Hospital Management System
        </div>

    </main>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const message = document.getElementById('msg');

        loginForm.addEventListener('submit', async function(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            message.textContent = 'Signing in...';
            loginButton.disabled = true;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Invalid username or password.');
                }

                if (!data.token) {
                    throw new Error('Login response did not contain a token.');
                }

                sessionStorage.setItem('carepoint_token', data.token);
                sessionStorage.setItem(
                    'carepoint_user',
                    JSON.stringify(data.user)
                );

                window.location.replace('/index.html');

            } catch (error) {
                message.textContent = error.message;
                loginButton.disabled = false;
            }
        });
    </script>

</body>
</html>
