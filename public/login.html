
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePoint | Staff Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: min(380px, 90%);
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            color: #1769d2;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
            color: #344054;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1769d2;
            box-shadow: 0 0 0 2px rgba(23, 105, 210, 0.12);
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #1769d2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1255ad;
        }

        button:disabled {
            background: #8aaddb;
            cursor: not-allowed;
        }

        #msg {
            min-height: 20px;
            margin-top: 16px;
            text-align: center;
            color: #b42318;
            font-size: 14px;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #98a2b3;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <main class="login-container">

        <h1>CarePoint</h1>
        <p class="subtitle">Hospital Management System</p>

        <form id="loginForm">

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                Login
            </button>

            <p id="msg" role="alert"></p>

        </form>

        <div class="footer">
            CarePoint Hospital Management System
        </div>

    </main>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const message = document.getElementById('msg');

        loginForm.addEventListener('submit', async function(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            message.textContent = 'Signing in...';
            loginButton.disabled = true;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Invalid username or password.');
                }

                if (!data.token) {
                    throw new Error('Login response did not contain a token.');
                }

                sessionStorage.setItem('carepoint_token', data.token);
                sessionStorage.setItem(
                    'carepoint_user',
                    JSON.stringify(data.user)
                );

                window.location.replace('/index.html');

            } catch (error) {
                message.textContent = error.message;
                loginButton.disabled = false;
            }
        });
    </script>

</body>
</html>
