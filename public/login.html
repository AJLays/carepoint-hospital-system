<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarePoint Login</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;font-family:Arial,sans-serif}.box{width:min(360px,90vw);background:white;padding:28px;border-radius:12px;box-shadow:0 8px 28px #0001}h1{color:#1769d2;margin-top:0}label{display:block;margin:14px 0 6px}input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #ccd5e1;border-radius:6px}button{margin-top:18px;width:100%;padding:12px;background:#1769d2;color:white;border:0;border-radius:6px;cursor:pointer}#msg{color:#b42318}</style></head>
<body><main class="box"><h1>CarePoint</h1><p>Staff Login</p><form id="form"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Login</button><p id="msg"></p></form></main>
<script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Signing in...';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Login failed');sessionStorage.setItem('carepoint_token',d.token);sessionStorage.setItem('carepoint_user',JSON.stringify(d.user));location.href='/index.html';}catch(err){msg.textContent=err.message;}});</script></body></html>
